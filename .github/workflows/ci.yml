name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The tests never start the ASP.NET Core host (they use EF InMemory and a hand-built
      # IConfiguration), so the app's JWT-key startup guard is not involved and no Jwt__Key
      # is needed here. If a test is ever added that boots the host, generate a throwaway key
      # for the job, for example: echo "Jwt__Key=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Test
        run: >-
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
